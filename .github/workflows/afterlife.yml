name: Raise the altar

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
  workflow_dispatch:
    inputs:
      repo:
        description: Public git repository whose dead will be honored
        default: https://github.com/pallets/flask.git
      model:
        description: Ollama model
        default: gemma3:4b

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v

  summon:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ inputs.repo || 'https://github.com/pallets/flask.git' }}
      MODEL: ${{ inputs.model || 'gemma3:4b' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Ollama and emoji fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null
          curl -fsSL https://ollama.com/install.sh | sh
          curl -sf http://localhost:11434/api/version || (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done

      - name: Pull the model
        run: ollama pull "$MODEL"

      - name: Dig up the repository
        run: git clone --quiet --filter=blob:none "$REPO" graveyard

      - name: Build the altars
        run: |
          mkdir site
          python3 afterlife.py summon graveyard --model "$MODEL" --out site/index.html
          python3 afterlife.py summon graveyard --model "$MODEL" --lang Spanish --out site/es.html

      - name: Hold a séance with the original flask.py
        if: env.REPO == 'https://github.com/pallets/flask.git'
        run: |
          printf '%s\n' \
            "Who are you, spirit?" \
            "What did you do when you were alive?" \
            "Why did they delete you?" \
            "Do you have a message for the developers who use Flask today?" \
            "adiós" \
            | python3 afterlife.py seance flask.py graveyard --model "$MODEL" | tee site/seance.txt

      - name: Take the portraits
        run: |
          shot() { google-chrome --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=4000 \
                     --window-size="$1" --screenshot="$2" "file://$PWD/$3"; }
          shot 1000,420 site/cover.png docs/cover.html
          shot 1280,1500 site/altar.png site/index.html
          shot 1280,1500 site/altar-es.png site/es.html

      - name: Record the séance as a GIF
        if: env.REPO == 'https://github.com/pallets/flask.git'
        continue-on-error: true
        uses: charmbracelet/vhs-action@v2
        with:
          path: docs/seance.tape

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: summon
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
